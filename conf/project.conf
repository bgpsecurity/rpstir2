[logs]
# LevelEmergency = iota
# LevelAlert
# LevelCritical
# LevelError
# LevelWarning
# LevelNotice
# LevelInformational
# LevelDebug
level=LevelInformational
#no extension, just name
#name=rpstir2
dir=/home/rpki/rpstir2/log
async=false

[mysql]
server=127.0.0.1:13306
user=rpstir2
password=Rpstir-123
database=rpstir2
maxidleconns=30
maxopenconns=200
# some time, no need mysql, just using rp
ingoreNoMySQLError=true
showSql=false

[sync]
talPath=/home/rpki/data/tal
supportTestCer=false
internalVerifyHttps=false
externalVerifyHttps=false
# if limitOfRepoNum==0 , means no limit;
limitOfRepoNum=1000000

[rsync]
destPath=/home/rpki/data/rsyncrepo
rsyncTimeout=100
rsyncConTimeout=100
rsyncConcurrentCount=20
# Millisecond
rsyncDefaultWaitMs=1
rsyncPerDelayMs=1
rsyncDelayRandMs=1
failRsyncUrlsTryCount=3

[rrdp]
destPath=/home/rpki/data/rrdprepo
rrdpConcurrentCount=100
rrdpNoticationTimeoutSeconds=60
rrdpNoticationTimeoutSeconds=360
rrdpDeltaTimeoutSeconds=300
retryCount=1
# Millisecond
rrdpDefaultWaitMs=1
rrdpPerDelayMs=1
rrdpDelayRandMs=1
failRrdpUrlsTryCount=3

[parse]
tmpDir=/tmp/
parseConcurrentCount=20
delConcurrentCount=100
parseInsertConcurrentCount=350
updateConcurrentCount=100
selectForUpdateWaitSec=15
receiveSyncRrdpResultBatchSize=500
batchUpdateCertsBatchSize=100

[openssl]
path=/home/openssl/openssl/bin
[chain]
getDbConcurrentCount=100
validateConcurrentCount=600
updateConcurrentCount=40
getCertsCountInOneSize=10000
# adoptChainValidatePartial=true
adoptChainValidatePartial=false
# validate roa:
forceValidateAllRoas=false

#forceValidat Roa by Path
forceValidatRoaPath=.zdns.cn
convertBatchSize=1000

# RP policy to judge state of cer/roa/crl/mft
# "warning" is from rfc6486
[policy]
#warning: No manifest is available for <pub point name>, and   thus there may have been undetected deletions or replay substitutions   from the publication point.
allowNoMft=true
# Invalid MFT will effect ROA/CRL/CER of same AKI: ignore/warning/invalid, like not found mft
# No manifest is available for <pub point name>, and thus there may have been undetected deletions or replay substitutions from the publication point.
invalidMftEffect=warning

#warning is just like mft
#warning: A crl found at <pub point name> is no longer current.  It is possible that undetected deletions have occurred at this publication point.
allowStaleCrl=true
#warning: A crl found at <pub point name> has an incorrect thisUpdate field.  This  could be due to publisher error, or a local clock error, and  processing for this publication point will continue using this  otherwise valid manifest.
allowNotYetCrl=true

#warning is just like roa
#warning: A roa found at <pub point name> is no longer current.  It is possible that undetected deletions have occurred at this publication point.
allowStaleEe=true
#warning: A roa found at <pub point name> has an incorrect thisUpdate field.  This  could be due to publisher error, or a local clock error, and  processing for this publication point will continue using this  otherwise valid manifest.
allowNotYetEe=true

# Certificate can be added that have not yet become valid or is stale. Yes includes
# these certificates, no excludes them, just set warning.
allowStaleCer=false
allowNotYetCer=false


[slurm]
slurmPath=/home/rpki/data/slurm/
triggerRtrAndTranfer=false
serverHost=127.0.0.1
serverHttpPort=8070
serverHttpsPort=8071
[rtr]
sendIntervalMs=0
protocolVersion=2
#refreshInterval=120
retryInterval=5
#expireInterval=150
checkTimeoutDisconnectTickerSeconds=500
timeoutDisconnectAlarmSeconds=1500
maxConnCount=330
recentSerialNumbersCount=2
sendnacosmsg=/home/rpki/rpstir2-rp/bin/sendnacosmsg
fullBatchSize=500
incrementalBatchSize=500
sendAlarmLimit=3
useRtrServer2=true
[sys]
#whois = true
#limitAsn = 20
#limitAddressPrefix = 20
#initTimeSeconds=720
initTimeSeconds=0
shutdownTimeoutSeconds=8
forceShutdownTimeoutSeconds=20
lockFile=/home/rpki/rpstir2-rp/bin/.lock
[clear]
# when is 0, will not clear
# maxSerialNumber - rtrNeedClear = willdelSerialNumber
# all smaller than willdelSerialNumber, will be del
#rtrNeedClear=0
rtrNeedClear=100
# In production, do not set a value greater than 0. else will del lab_rpki_**
syncLogFileNeedClear=0
